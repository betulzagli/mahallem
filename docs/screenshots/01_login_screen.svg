<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3158C9"/>
      <stop offset="100%" stop-color="#213E96"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF795E"/>
      <stop offset="100%" stop-color="#E05335"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="5" y="5" width="370" height="750" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="12" y="12" width="356" height="736" rx="30" fill="#F7F8FC"/>

  <!-- Status Bar & Dynamic Island -->
  <rect x="130" y="20" width="120" height="24" rx="12" fill="#1E293B"/>
  <circle cx="230" cy="32" r="4.5" fill="#0F172A"/>
  <text x="36" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">09:41</text>
  <path d="M 330 29 A 6 6 0 0 1 342 29 L 342 35 A 6 6 0 0 1 330 35 Z" fill="#1E293B"/>
  <rect x="344" y="31" width="2" height="3" rx="1" fill="#1E293B"/>

  <!-- Logo and Header -->
  <g transform="translate(190, 110)">
    <circle cx="0" cy="0" r="38" fill="url(#primaryGrad)"/>
    <path d="M -18 -4 L 0 -22 L 18 -4 L 18 16 L -18 16 Z" fill="#FFFFFF"/>
    <rect x="-6" y="2" width="12" height="14" fill="#3158C9"/>
  </g>

  <text x="190" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#20283A" text-anchor="middle">Mahallem</text>
  <text x="190" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#4A5568" text-anchor="middle">Dijital Mahalle Pazarı</text>

  <!-- Login Card -->
  <rect x="28" y="225" width="324" height="495" rx="20" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>

  <text x="48" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#20283A">Giriş Yap</text>
  <text x="48" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4A5568">Hesabınıza giriş yaparak alışverişe başlayın</text>

  <!-- Input Field 1: Email -->
  <text x="48" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#20283A">E-posta Adresi</text>
  <rect x="48" y="322" width="284" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1E293B">musteri@mahallem.com</text>

  <!-- Input Field 2: Password -->
  <text x="48" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#20283A">Şifre</text>
  <rect x="48" y="400" width="284" height="44" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="64" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B">••••••••••••</text>
  <path d="M 310 422 C 305 416, 298 428, 303 422" stroke="#64748B" stroke-width="1.5" fill="none"/>

  <!-- Forgot Password -->
  <text x="332" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#3158C9" text-anchor="end">Şifremi Unuttum?</text>

  <!-- Login Button -->
  <rect x="48" y="478" width="284" height="46" rx="12" fill="url(#primaryGrad)"/>
  <text x="190" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Giriş Yap</text>

  <!-- Divider -->
  <line x1="48" y1="545" x2="160" y2="545" stroke="#E2E8F0" stroke-width="1"/>
  <text x="190" y="549" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">VEYA</text>
  <line x1="220" y1="545" x2="332" y2="545" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Fast Role Switch Buttons -->
  <rect x="48" y="565" width="284" height="42" rx="10" fill="#E5EBFF" stroke="#3158C9" stroke-width="1"/>
  <text x="190" y="591" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3158C9" text-anchor="middle">👤 Müşteri Olarak Hızlı Gir</text>

  <rect x="48" y="617" width="284" height="42" rx="10" fill="#FFF0EB" stroke="#FF795E" stroke-width="1"/>
  <text x="190" y="643" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8C2E17" text-anchor="middle">🏪 Esnaf / İşletme Olarak Gir</text>

  <!-- Register Link -->
  <text x="190" y="692" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4A5568" text-anchor="middle">Hesabınız yok mu? <tspan fill="#3158C9" font-weight="700">Kayıt Olun</tspan></text>
</svg>

