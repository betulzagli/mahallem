<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="370" height="750" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="12" y="12" width="356" height="736" rx="30" fill="#CBD5E1"/>

  <!-- Dimmed Background Overlay -->
  <rect x="12" y="12" width="356" height="736" rx="30" fill="#0F172A" fill-opacity="0.5"/>

  <!-- Add Product Modal Dialog -->
  <g transform="translate(24, 75)" filter="url(#modalShadow)">
    <rect x="0" y="0" width="332" height="615" rx="20" fill="#FFFFFF"/>

    <!-- Dialog Header -->
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#20283A">Yeni Ürün Ekle</text>
    <text x="312" y="34" font-size="16" fill="#64748B" text-anchor="end">✕</text>

    <!-- 1. Live Preview Card -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="300" height="64" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="8" y="8" width="48" height="48" rx="8" fill="#FDE8E8"/>
      <text x="32" y="38" font-size="24" text-anchor="middle">🍅</text>
      <text x="66" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">Salkım Domates</text>
      <text x="66" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#3158C9">✓ Özel fotoğraf seçildi</text>
      <circle cx="282" cy="32" r="10" fill="#CBD5E1"/>
      <text x="282" y="36" font-size="10" fill="#475569" text-anchor="middle">✕</text>
    </g>

    <!-- 2. Form Inputs: Name & Description -->
    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A">Ürün Adı *</text>
    <rect x="16" y="140" width="300" height="36" rx="8" fill="#FFFFFF" stroke="#3158C9" stroke-width="1.5"/>
    <text x="26" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#20283A">Salkım Domates</text>

    <text x="16" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#4A5568">Açıklama</text>
    <rect x="16" y="202" width="300" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="26" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">Taze bahçe domatesi</text>

    <!-- 3. Price & Stock Row -->
    <g transform="translate(16, 246)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A">Birim Fiyat (TL) *</text>
      <rect x="0" y="16" width="144" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="12" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">38.00</text>

      <text x="156" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#20283A">Stok Miktarı</text>
      <rect x="156" y="16" width="144" height="36" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="168" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#20283A">25</text>
    </g>

    <!-- 4. Photo URL Input -->
    <g transform="translate(16, 312)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A">Fotoğraf Bağlantısı (URL)</text>
      <rect x="0" y="16" width="300" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B">https://images.unsplash.com/photo-159292435...</text>
    </g>

    <!-- 5. Preset Photo Gallery (1-Tap Selection) -->
    <g transform="translate(16, 375)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3158C9">Veya Hazır Gerçek Fotoğraflardan Seçin:</text>
      
      <!-- Preset 1: Domates (Selected) -->
      <rect x="0" y="18" width="54" height="64" rx="8" fill="#E5EBFF" stroke="#3158C9" stroke-width="2"/>
      <rect x="6" y="24" width="42" height="36" rx="6" fill="#FDE8E8"/>
      <text x="27" y="48" font-size="20" text-anchor="middle">🍅</text>
      <text x="27" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#3158C9" text-anchor="middle">Domates</text>

      <!-- Preset 2: Süt -->
      <rect x="60" y="18" width="54" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="66" y="24" width="42" height="36" rx="6" fill="#F1F5F9"/>
      <text x="87" y="48" font-size="20" text-anchor="middle">🥛</text>
      <text x="87" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Süt</text>

      <!-- Preset 3: Yumurta -->
      <rect x="120" y="18" width="54" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="126" y="24" width="42" height="36" rx="6" fill="#FEF3E4"/>
      <text x="147" y="48" font-size="20" text-anchor="middle">🥚</text>
      <text x="147" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Yumurta</text>

      <!-- Preset 4: Ekmek -->
      <rect x="180" y="18" width="54" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="186" y="24" width="42" height="36" rx="6" fill="#FFFBEB"/>
      <text x="207" y="48" font-size="20" text-anchor="middle">🥖</text>
      <text x="207" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Ekmek</text>

      <!-- Preset 5: Kıyma -->
      <rect x="240" y="18" width="54" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="246" y="24" width="42" height="36" rx="6" fill="#FDE8E8"/>
      <text x="267" y="48" font-size="20" text-anchor="middle">🥩</text>
      <text x="267" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Kıyma</text>
    </g>

    <!-- 6. Unit Selection & Active Switch -->
    <g transform="translate(16, 475)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A">Birim Tipi: Kilogram (kg)</text>
      <text x="180" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A">Satışta Açık (Aktif)</text>
      <rect x="265" y="2" width="35" height="18" rx="9" fill="#1B6B49"/>
      <circle cx="291" cy="11" r="7" fill="#FFFFFF"/>
    </g>

    <!-- Dialog Actions -->
    <g transform="translate(16, 545)">
      <rect x="0" y="0" width="90" height="42" rx="10" fill="#F1F5F9"/>
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">İptal</text>

      <rect x="100" y="0" width="200" height="42" rx="10" fill="#3158C9"/>
      <text x="200" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ürünü Kaydet</text>
    </g>
  </g>
</svg>

