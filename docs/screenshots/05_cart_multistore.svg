<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="370" height="750" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="12" y="12" width="356" height="736" rx="30" fill="#F7F8FC"/>

  <!-- Status Bar & Notch -->
  <rect x="130" y="20" width="120" height="24" rx="12" fill="#1E293B"/>
  <text x="36" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">09:41</text>
  <rect x="330" y="27" width="16" height="10" rx="3" fill="#1E293B"/>

  <!-- Header Bar -->
  <text x="32" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#20283A">Sepetim</text>
  <text x="348" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#C02626" text-anchor="end">Sepeti Temizle</text>

  <!-- Multi-Store Rule Pill (2/3 Market) -->
  <g transform="translate(24, 95)">
    <rect x="0" y="0" width="332" height="34" rx="8" fill="#E5EBFF" stroke="#3158C9" stroke-width="1"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3158C9">🏪 Çoklu Pazar Sepeti (2/3 Market Dolu)</text>
    <text x="318" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3158C9" text-anchor="end">1 Market Daha Eklenebilir</text>
  </g>

  <!-- Store 1 Group: Gültepe Bakkalı -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="332" height="110" rx="12" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#20283A">🏪 Gültepe Bakkalı</text>
    <line x1="14" y1="34" x2="318" y2="34" stroke="#F1F5F9" stroke-width="1"/>
    
    <!-- Item 1: Süt -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">Günlük Doğal Süt (1 L)</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">36.50 TL • 1 adet</text>
    <text x="318" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#3158C9" text-anchor="end">36.50 TL</text>
  </g>

  <!-- Store 2 Group: Can Kardeşler Manav -->
  <g transform="translate(24, 260)">
    <rect x="0" y="0" width="332" height="110" rx="12" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#20283A">🍏 Can Kardeşler Manav</text>
    <line x1="14" y1="34" x2="318" y2="34" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Item 2: Domates -->
    <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">Salkım Domates</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B">38.00 TL/kg • 2 kg</text>
    <text x="318" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#3158C9" text-anchor="end">76.00 TL</text>
  </g>

  <!-- Delivery Calculation Breakdown Card -->
  <g transform="translate(24, 385)">
    <rect x="0" y="0" width="332" height="150" rx="14" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#20283A">Sipariş Özeti &amp; Teslimat Hesabı</text>
    
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4A5568">Ürünler Toplamı</text>
    <text x="316" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#20283A" text-anchor="end">112.50 TL</text>

    <!-- Formula breakdown -->
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4A5568">Teslimat Taban Ücreti</text>
    <text x="316" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="end">20.00 TL</text>

    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4A5568">Market Sayısı Ek Ücreti (2 market × 5 TL)</text>
    <text x="316" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="end">10.00 TL</text>

    <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4A5568">Tahmini Rota Mesafesi (2.8 km × 3 TL)</text>
    <text x="316" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="end">8.40 TL</text>

    <line x1="16" y1="126" x2="316" y2="126" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="16" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3158C9">Toplam Teslimat Ücreti</text>
    <text x="316" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#3158C9" text-anchor="end">38.40 TL</text>
  </g>

  <!-- Grand Total Bar -->
  <g transform="translate(24, 550)">
    <rect x="0" y="0" width="332" height="75" rx="14" fill="#FFFFFF" stroke="#3158C9" stroke-width="1.5"/>
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4A5568">Ödenecek Genel Toplam:</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#3158C9">150.90 TL</text>
    <text x="316" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748B" text-anchor="end">KDV Dahil • Tek Kurye</text>
  </g>

  <!-- Checkout Button -->
  <g transform="translate(24, 645)">
    <rect x="0" y="0" width="332" height="54" rx="14" fill="#3158C9" filter="url(#shadow)"/>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Siparişi Onayla ve Öde →</text>
  </g>
</svg>

