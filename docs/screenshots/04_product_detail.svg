<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="370" height="750" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)"/>
  <rect x="12" y="12" width="356" height="736" rx="30" fill="#F7F8FC"/>

  <!-- Status Bar & Notch -->
  <rect x="130" y="20" width="120" height="24" rx="12" fill="#1E293B"/>
  <text x="36" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1E293B">09:41</text>
  <rect x="330" y="27" width="16" height="10" rx="3" fill="#1E293B"/>

  <!-- Header Bar -->
  <rect x="24" y="56" width="36" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="42" y="78" font-size="16" text-anchor="middle">←</text>
  <text x="190" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#20283A" text-anchor="middle">Ürün Detayı</text>
  <rect x="320" y="56" width="36" height="36" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="338" y="79" font-size="16" text-anchor="middle">❤️</text>

  <!-- Product Image Hero Box -->
  <g transform="translate(24, 105)">
    <rect x="0" y="0" width="332" height="210" rx="18" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>
    <rect x="12" y="12" width="308" height="186" rx="12" fill="#FDE8E8"/>
    <text x="166" y="118" font-size="70" text-anchor="middle">🍅</text>
    <rect x="20" y="20" width="60" height="22" rx="6" fill="#1B6B49"/>
    <text x="50" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">STOKTA</text>
  </g>

  <!-- Product Metadata -->
  <g transform="translate(24, 335)">
    <rect x="0" y="0" width="332" height="290" rx="18" fill="#FFFFFF" stroke="#D9DFEA" stroke-width="1"/>

    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#20283A">Salkım Domates</text>
    <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#3158C9">🏪 Can Kardeşler Manav</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#4A5568">Doğal tarla hasadı, taze kokulu salkım domates.</text>

    <!-- Unit Selection (Kg vs Adet) -->
    <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">Birim Seçimi (Farklı Fiyatlandırma):</text>
    
    <!-- Option 1: Kg (Selected) -->
    <rect x="20" y="124" width="140" height="52" rx="10" fill="#E5EBFF" stroke="#3158C9" stroke-width="2"/>
    <text x="90" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3158C9" text-anchor="middle">✓ Kilogram (kg)</text>
    <text x="90" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#3158C9" text-anchor="middle">38.00 TL</text>

    <!-- Option 2: Adet -->
    <rect x="172" y="124" width="140" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="242" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Adet (Tane)</text>
    <text x="242" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle">6.50 TL</text>

    <!-- Quantity Stepper -->
    <text x="20" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#20283A">Miktar (kg):</text>
    <rect x="20" y="222" width="120" height="42" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="38" y="248" font-size="18" font-weight="700" fill="#3158C9" text-anchor="middle">−</text>
    <text x="80" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#20283A" text-anchor="middle">2</text>
    <text x="122" y="248" font-size="18" font-weight="700" fill="#3158C9" text-anchor="middle">+</text>

    <!-- Total for this item -->
    <text x="312" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748B" text-anchor="end">Toplam Tutar</text>
    <text x="312" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#3158C9" text-anchor="end">76.00 TL</text>
  </g>

  <!-- Add to Cart CTA -->
  <g transform="translate(24, 645)">
    <rect x="0" y="0" width="332" height="54" rx="14" fill="#3158C9" filter="url(#shadow)"/>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">🛒 Sepete Ekle (76.00 TL)</text>
  </g>
</svg>

